<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphone Card</title>
  <style>
    body {
      background-color: #ccc;
      font-family: sans-serif;
    }

    .cardheadphone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .cardheadphone:hover .asquare {
      width: 114px;
      height: 114px;
      transition: all 1s;
    }

    .cardheadphone:hover .atriangle {
      border-bottom: 115px solid transparent;
      border-right: 115px solid #ff6600;
      border-bottom-left-radius: 10%;
      transition: all 1s;
    }

    .cardheadphone:hover .number {
      display: none;
      transition: all 1s;
    }

    .cardheadphone:hover .Acard {
      left: 0px;
      transition: all 1s;
    }

    .cardheadphone:hover .card-img {
      top: 95px;
      transition: all 1s;
      width: 110px;
    }

    .cardheadphone:hover .text-content {
      top: 200px;
      transition: all 1s;
    }

    .Acard {
      position: relative;
      left: 25px;
      top: 10px;
      transition: all 1s;
    }

    .Bcard {
      position: relative;
      top: -109px;
    }

    .asquare {
      width: 89px;
      height: 25px;
      background-color: #ff6600;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      transition: all 1s;
    }

    .atriangle {
      width: 0;
      height: 0;
      border-bottom: 90px solid transparent;
      border-right: 90px solid #ff6600;
      border-bottom-left-radius: 10%;
      transition: all 1s;
    }

    .overveiw {
      /* display: none; */
      position: absolute;
      top: 100px;
      left: 100px;
    }

    .overveiwbar .dline {
      width: 50px;
      height: 5px;
      background-image: linear-gradient(#90e0ef 99%, #00b4d8 1%);
    }

    .overveiwbar .ftriangle {
      width: 0;
      height: 0;
      border-bottom: 100px solid linear-greadient();
    }

    .ovw {
      font-size: 8px;
    }

    .btriangle {
      width: 0;
      height: 0;
      border-bottom: 115px solid white;
      border-right: 115px solid transparent;
      border-top-left-radius: 10%;
    }

    .bsquare {
      width: 114px;
      height: 25px;
      background-color: white;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      position: relative;
    }

    .number {
      position: absolute;
      top: 10px;
      right: 30px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      transition:all 1s;
    }

    .card-img {
      position: absolute;
      top: 10px;
      left: 50px;
      transform: translateX(-50%);
      width: 80px;
      z-index: 1;
      transition:all 1s;
    }

    .text-content {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #333;
      text-align: center;
      transition:all 1s;
    }

    .text-content h4 {
      margin: 2px 0 0;
      font-size: 12px;
    }

    .text-content p {
      margin: 0;
      font-size: 10px;
      color: gray;
    }

    .icon {
      font-size: 8px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="cardheadphone">
    <div class="Acard">
      <div class="asquare"></div>
      <div class="atriangle">
        <div class="number">710</div>
        <div class="overveiw">
          <small class="ovw">overveiw</small><br>
          <strong>78K</strong>
          <div class="overveiwbar">
            <div class="dline"></div>
            <div class="ftriangle"></div>
            <div class="dtriangle"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="Bcard">
      <div class="btriangle"></div>
      <div class="bsquare"> </div>
    </div>
    <img class="card-img" src="Headphones.png" alt="Aura PBL Wireless">
    <div class="text-content">
      <div class="icon">📱 TECHNOLOGY</div>
      <h4>Aura PBL</h4>
      <p>Wireless</p>
    </div>
  </div>
</body>
</html>
