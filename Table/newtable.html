<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new Table</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        table{
            background-color: #FF0080;
            padding: 10px;
            border-collapse: collapse;
            color: black;
            text-align: center;
            height: 775px;
            width: 100%;
        }
        td{
            border: 3px solid white;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">1</td>
            <td rowspan="2">2</td>
            <td rowspan="2">3</td>
            <td rowspan="2">4</td>
            <td rowspan="2">5</td>
            <td rowspan="2" colspan="2">6</td>
            <td rowspan="4" colspan="2">7</td>
            <td colspan="2">8</td>
        </tr>
        <tr>
            <td colspan="4">9</td>
            <td colspan="2">10</td>
        </tr>
        <tr>
            <td colspan="4">11</td>
            <td>12</td>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td rowspan="4" colspan="2">16</td>
            <td colspan="2">17</td>
        </tr>
        <tr>
            <td colspan="4">18</td>
            <td>19</td>
            <td>20</td>
            <td>21</td>
            <td>22</td>
            <td colspan="2">23</td>
        </tr>
        <tr>
            <td rowspan="4">24</td>
            <td rowspan="4">25</td>
            <td rowspan="4">26</td>
            <td rowspan="4">27</td>
            <td>28</td>
            <td>29</td>
            <td>30</td>
            <td>31</td>
            <td rowspan="4" colspan="2">34</td>
            <td colspan="2">35</td>
        </tr>
        <tr>
            <td>36</td>
            <td>37</td>
            <td>38</td>
            <td>39</td>
            <td colspan="2">40</td>
        </tr>
        <tr>
            <td>41</td>
            <td>42</td>
            <td>43</td>
            <td>44</td>
            <td rowspan="2" colspan="2">45</td>
            <td colspan="2">46</td>
        </tr>
        <tr>
            <td>47</td>
            <td>48</td>
            <td>49</td>
            <td>50</td>
            <td colspan="2">51</td>
        </tr>
    </table>
</body>
</html>
