<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>time table</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        table{
            border: 1px solid black;
            margin: 0 auto;
            margin-top: 100px;
            width: 700px;
            border-collapse: collapse;
            /* text-align: center; */
            font-style: italic;
        }
        th{
            border: 1px solid black;
            padding: 20px;
            background-color: gray;
        }
        td{
            border: 1px solid black;
            padding: 20px;
            background-color: aqua;
        }
        span{
            float: right;
            margin-right: 90px;
        }
    </style>
</head>
<body>
    <table>
        <caption>Rohan</caption>
        <thead>
        <tr>
            <th></th>
            <th></th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="3"></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td colspan="5">Highest Rating <span>9.5</span></td>
        </tr>
        <tr>
            <td rowspan="2"></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td colspan="4"></td>
            <td></td>
        </tr>
    </tbody>
    <tfoot>
        <tr><td colspan="5"></td></tr>
    </tfoot>
    </table>
</body>
</html>
