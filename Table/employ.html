<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Table</title>
  <style>
    body {
      background-color: black   ;
      padding: 20px;
      color: beige;
    }

    h1 {
      text-align: center;
      color: rosybrown;
      background-color: rebeccapurple;
    }

    table {
      background-color: white;
      color: black;
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
    }

    td {
      border: 1px solid red;
      padding: 10px;
      text-align: center;
    }

    th{
      background-color: gray;
      padding: 10px;
      border: 2px solid red;
    }
  </style>
</head>
<body>

  <h1>Employee Details</h1>

  <table>
    <tr>
      <th>Employee ID</th>
      <th>Employee Name</th>
      <th>Department</th>
      <th>Salary</th>
    </tr>
    <tr>
      <td>101</td>
      <td>vijay Sharma</td>
      <td>IT</td>
      <td>₹50,000</td>
    </tr>
    <tr>
      <td>102</td>
      <td>Priya Verma</td>
      <td>HR</td>
      <td>₹62,000</td>
    </tr>
    <tr>
      <td>103</td>
      <td>Ankit</td>
      <td>Finance</td>
      <td>₹55,000</td>
    </tr>
    <tr>
      <td>104</td>
      <td>Rohan jadhav</td>
      <td>Marketing</td>
      <td>₹70,000</td>
    </tr>
  </table>

</body>
</html>
