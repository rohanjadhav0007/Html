<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        table{
            color: brown;
            text-align: center;
            margin: 0;
            
        }
        th{
            background-color: aqua;
            border: 2px solid blue;
        }
        td{
            background-color: blueviolet;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <th>Team</th>
                <th>Player</th>
                <th colspan="2">Statistice</th>
            </tr>
            <tr>
                <td rowspan="2">Team A</td>
                <td>Player 1</td>
                <td>Goals: 4</td>
                <td>Assists: 7</td>
            </tr>
            <tr>
                <td>Player 2</td>
                <td>Goals: 6</td>
                <td>Assists: 5</td>
            </tr>
            <tr>
                <td rowspan="2">Team B</td>
                <td>Player 3</td>
                <td>Goals: 5</td>
                <td>Assists: 6</td>
            </tr>
            <tr>
                <td>Player 4</td>
                <td>Goals: 3</td>
                <td>Assists: 8</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
